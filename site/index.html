<!doctype html>
<!-- Static page. Overview: js/overview.js + js/card.js (+ js/lineup.js); #timeline: js/timeline.js. Demo mode (the #demo block below): js/demo.js + js/tap.js. -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FestivAR Weekly demo</title>
  <link rel="icon" type="image/svg+xml" href="logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/overview.css" />
  <link rel="stylesheet" href="css/lineup.css" />
  <link rel="stylesheet" href="css/timeline.css" />
  <link rel="stylesheet" href="css/demo.css" />
</head>
<body>
  <header class="top">
    <div class="brand"><img src="logo.svg" alt="" /> FestivAR <span class="muted">· Weekly demo</span></div>
    <div class="top-actions">
      <select id="sprint" aria-label="Sprint"></select>
      <button id="theme" aria-label="Toggle dark mode"></button>
      <button id="play" class="primary">▶ <span class="long">Play the </span>demo</button>
    </div>
  </header>

  <main id="main">
    <p class="loading">Loading…</p>
  </main>

  <div id="demo" class="demo" hidden>
    <div class="demo-top">
      <div class="demo-progress"><div id="demo-bar"></div></div>
      <div class="demo-tools">
        <div class="seg" id="demo-variant"></div>
        <button id="demo-auto" class="ghost" title="Autoplay (space)">⏵ Auto</button>
        <button id="demo-close" class="ghost" title="Close (Escape)">✕</button>
      </div>
    </div>
    <div class="demo-stage">
      <button class="arrow left" id="prev" aria-label="Previous">‹</button>
      <div class="demo-caption" id="caption"></div>
      <div class="float">
        <div class="device" id="device">
          <div class="screen" id="screen"></div>
          <div class="hand" id="hand">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 13v-8.5a1.5 1.5 0 0 1 3 0v7.5M11 11.5v-2a1.5 1.5 0 1 1 3 0v2.5M14 10.5a1.5 1.5 0 0 1 3 0v1.5M17 11.5a1.5 1.5 0 0 1 3 0v4.5a6 6 0 0 1 -6 6h-2h.208a6 6 0 0 1 -5.012 -2.7l-.196 -.3c-.312 -.479 -1.407 -2.388 -3.286 -5.728a1.5 1.5 0 0 1 .536 -2.022a1.867 1.867 0 0 1 2.28 .28l1.47 1.47"/></svg>
          </div>
        </div>
        <div class="shadow"></div>
      </div>
      <button class="arrow right" id="next" aria-label="Next">›</button>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
