# Every Friday: captures all FestivAR screens (read-only clone), compares them with the previous sprint,
# saves the sprint on the `data` branch and publishes the demo site to GitHub Pages.
# Requires Settings -> Pages -> Source = "GitHub Actions" on this repo.
name: Weekly demo

on:
  # Friday 07:30 Swiss time. GitHub cron is UTC only, so both offsets are listed and the
  # `when` job keeps the one matching the current Swiss offset (summer +02, winter +01).
  schedule:
    - cron: "30 5 * * 5"
    - cron: "30 6 * * 5"
  workflow_dispatch: # by hand: Actions -> Weekly demo -> Run workflow
    inputs:
      date:
        description: "Rebuild the sprint containing this date (YYYY-MM-DD). Empty = now."
        required: false
      backfill:
        description: "Also (re)build every sprint from this sprint number on, oldest first (e.g. 4). Empty = no."
        required: false
  push: # a change to this repo rebuilds every sprint from FIRST_SPRINT on (scripts/lib/config.mjs)
    branches: [main]
    paths: ["site/**", "scripts/**", "capture/**", "demo.json", ".github/workflows/**"]

permissions:
  contents: write # push the sprint to the `data` branch
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  when:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        run: |
          GO=true
          if [ "${{ github.event_name }}" = "schedule" ]; then
            OFFSET="$(TZ=Europe/Zurich date +%z)" # +0200 in summer, +0100 in winter
            case "${{ github.event.schedule }}/$OFFSET" in
              "30 5 * * 5/+0200"|"30 6 * * 5/+0100") GO=true ;;
              *) GO=false ;;
            esac
          fi
          echo "go=$GO" >> "$GITHUB_OUTPUT"

  build:
    needs: when
    if: needs.when.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120 # a backfill of several sprints captures FestivAR several times
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund

      - name: Open the history (data branch, created on the first run)
        run: |
          if git ls-remote --exit-code --heads origin data > /dev/null; then
            git fetch --depth=1 origin data
            git worktree add history FETCH_HEAD
          else
            git worktree add --detach history
            git -C history checkout --orphan data
            git -C history rm -rf --quiet .
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Clone FestivAR (read-only)
        run: git clone https://github.com/SwEnt-FestivAR/FestivAR.git festivar

      - name: Capture the sprint
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE="${{ github.event.inputs.date }}"
          DATE="${DATE:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}"
          FROM="${{ github.event.inputs.backfill }}"
          if [ "${{ github.event_name }}" = push ]; then FROM=first; fi
          # Dates to capture, oldest first: a baseline or backfilled sprints, then this one.
          for AT in $(node scripts/sprint.mjs "$DATE" history "$FROM"); do
            REF="$(git -C festivar rev-list -1 --before="$AT" origin/main)"
            bash scripts/capture.sh festivar "$REF" "$AT" history
          done

      - name: Save the history
        working-directory: history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Sprint $(jq -r '.[0].number' index.json)" || echo "Nothing new"
          git push -q origin HEAD:data

      - name: Assemble the site
        run: |
          mkdir -p site/data
          [ -f history/index.json ] && cp -r history/index.json history/sprints history/shots site/data/
          cp demo.json site/data/demo.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
